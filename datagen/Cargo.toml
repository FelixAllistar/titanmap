[package]
name = "datagen"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Downloads Path of Titans map data from VulnonaMAP and converts it to titanmap's tiles + JSON"

[dependencies]
ureq = "2"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
