[package]
name = "titanmap"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Fast Path of Titans map: desktop overlay + web, built with Rune"
repository = "https://github.com/FelixAllistar/titanmap"

[lib]
name = "titanmap_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "titanmap"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "02042d8", default-features = false, features = ["embedded-fonts", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rustfft = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[workspace]
members = [".", "datagen"]
resolver = "3"

[profile.release]
debug = false
codegen-units = 16

# Image decoding and the locator are slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2

# Cargo doesn't inherit a dependency's patches: mirror Rune's [patch.crates-io] at the same rev.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "02042d8" }
naga = { git = "https://github.com/anomalyco/rune", rev = "02042d8" }
winit = { git = "https://github.com/anomalyco/rune", rev = "02042d8" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "02042d8" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "02042d8" }
